  <title
     id="title1">Multimodal Deep SVDD learns a hypersphere over fused representations</title>
  <desc
     id="desc1">Modalities A, B, and C are fused into a combined representation z. Deep SVDD maps that combined representation into a space where normal samples lie in a compact hypersphere centered at c. Red diamonds illustrate anomalous test representations. The sphere is drawn as a two-dimensional cross-section.</desc>
